output_folder: s3://dea-public-data-dev/projects/burn_cube/derivative

input_products:
  platform: ls
  geomed_name: ga_ls8c_nbart_gm_4cyear_2016
  wofs_summary_name: ga_ls_wo_fq_cyear_3
  input_gm_bands:
    - red
    - green
    - blue
    - nir
    - swir1
    - swir2

product:
  name: dea_ml_ba_rf_with_landcover_level3_xgboost_model_08_01_2025
  short_name: dea_ml_ba_rf_with_landcover_level3_xgboost_model_08_01_2025
  version: 3.0.0
  product_family: vic_rf
  bands:
    - wofsstartdate
    - wofsseverity
    - wofssevere
    - wofsmoderate
    - wofsduration
    - wofscorroborate
    - wofscleaned
    - count
  inherit_skip_properties:
    - eo:cloud_cover
    - fmask:clear
    - fmask:snow
    - fmask:cloud
    - fmask:water
    - fmask:cloud_shadow
    - eo:sun_elevation
    - eo:sun_azimuth
    - gqa:iterative_stddev_x
    - gqa:iterative_stddev_y
    - gqa:iterative_stddev_xy
    - gqa:stddev_xy
    - gqa:stddev_x
    - gqa:stddev_y
    - gqa:mean_xy
    - gqa:mean_x
    - gqa:mean_y
    - gqa:abs_xy
    - gqa:abs_x
    - gqa:abs_y
    - gqa:abs_iterative_mean_y
    - gqa:abs_iterative_mean_x
    - gqa:abs_iterative_mean_xy
    - gqa:iterative_mean_xy
    - gqa:iterative_mean_x
    - gqa:iterative_mean_y
    - gqa:cep90
    - landsat:landsat_product_id
    - landsat:landsat_scene_id
    - landsat:collection_category
    - landsat:collection_number
    - landsat:wrs_path
    - landsat:wrs_row
    - fmask:clear
  thumbnail_styling:
    index_function:
      function: datacube_ows.band_utils.single_band
      kwargs:
        band: wofssevere
      mapped_bands: true
    mpl_ramp: Oranges
    name: dea_ml_ba_rf_with_landcover_level3_xgboost_model_08_01_2025
    needed_bands:
    - wofssevere
    range:
    - 0
    - 1

task_table: 10-year-historical-processing-4year-geomad.csv
training_dataset_url: https://dea-public-data-dev.s3.ap-southeast-2.amazonaws.com/projects/burn_cube/configs/RF_training_data_21_tiles_1000m_grid_3000m_to_7000m_buffer_lc_level3_only.csv
model_path: https://dea-public-data-dev.s3.ap-southeast-2.amazonaws.com/projects/burn_cube/configs/dea_ml_ba_rf_with_landcover_level3_rf_model_08_01_2025.joblib
model_features:
  - NDVI_post
  - NBR_post
  - NDMI_post
  - VARI_post
  - BAI_post
  - NDVI_pre
  - NBR_pre
  - NDMI_pre
  - VARI_pre
  - dNBR
  - dNDVI
  - dVARI
  - dNDMI
  - climate_code_1
  - climate_code_3
  - climate_code_2
  - level3_0
  - level3_111
  - level3_112
  - level3_124
  - level3_215
  - level3_216
  - level3_220

model_type: XGBOOST

param_grid:
  n_estimators:
    - 50
    - 100
    - 150
    - 200
  max_depth:
    - 10
    - 20
    - 30
  learning_rate:
    - 0.01
    - 0.1
    - 0.2
  subsample:
    - 0.8
    - 0.9
    - 1.0
  colsample_bytree:
    - 0.8
    - 0.9
    - 1.0
  gamma:
    - 0
    - 0.1
    - 0.2
